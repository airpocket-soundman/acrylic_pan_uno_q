<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">UNO Q low-latency strike-to-sound flow</title>
  <desc id="desc">A timeline shows deterministic capture on the STM32 side followed by packed transfer, warmed TFLite inference, immediate event delivery, cached audio and synchronized browser visualization.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071d29"/><stop offset="1" stop-color="#13394a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".3"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ffbd4a"/></marker><style>.h{font:700 42px Arial,sans-serif;fill:#fff}.sub{font:22px Arial,sans-serif;fill:#accbd5}.n{font:700 34px Arial,sans-serif;fill:#071d29}.label{font:700 23px Arial,sans-serif;fill:#fff}.body{font:18px Arial,sans-serif;fill:#d9edf2}.arrow{stroke:#ffbd4a;stroke-width:7;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="760" fill="url(#bg)"/><text x="75" y="78" class="h">FROM STRIKE TO SOUND — DESIGNED FOR LOW LATENCY</text><text x="75" y="116" class="sub">Models, camera service, web server and audio cache are ready immediately after UNO Q boots</text>
  <line x1="160" y1="390" x2="1440" y2="390" class="arrow"/>
  <g filter="url(#s)"><circle cx="170" cy="390" r="58" fill="#ff654d"/><text x="159" y="402" class="n">1</text><rect x="75" y="190" width="270" height="125" rx="20" fill="#123241"/><text x="105" y="232" class="label">IMPACT TRIGGER</text><text x="105" y="268" class="body">64 samples already buffered</text><text x="105" y="294" class="body">on the STM32 MCU</text></g>
  <g filter="url(#s)"><circle cx="470" cy="390" r="58" fill="#ffbd4a"/><text x="459" y="402" class="n">2</text><rect x="365" y="465" width="275" height="140" rx="20" fill="#123241"/><text x="395" y="507" class="label">20 ms CAPTURE</text><text x="395" y="543" class="body">25.6 kHz • no averaging</text><text x="395" y="569" class="body">direct GPIO SPI</text></g>
  <g filter="url(#s)"><circle cx="770" cy="390" r="58" fill="#57d3df"/><text x="759" y="402" class="n">3</text><rect x="665" y="190" width="280" height="140" rx="20" fill="#123241"/><text x="695" y="232" class="label">PACKED BRIDGE</text><text x="695" y="268" class="body">8 × 64-sample chunks</text><text x="695" y="294" class="body">instead of 512 messages</text></g>
  <g filter="url(#s)"><circle cx="1070" cy="390" r="58" fill="#67dfcf"/><text x="1059" y="402" class="n">4</text><rect x="965" y="465" width="285" height="140" rx="20" fill="#123241"/><text x="995" y="507" class="label">WARMED TFLITE AI</text><text x="995" y="543" class="body">Embedded FFT + temporal</text><text x="995" y="569" class="body">kernels on QRB2210</text></g>
  <g filter="url(#s)"><circle cx="1370" cy="390" r="58" fill="#f06e9a"/><text x="1359" y="402" class="n">5</text><rect x="1260" y="190" width="275" height="140" rx="20" fill="#123241"/><text x="1290" y="232" class="label">SOUND + VISUAL</text><text x="1290" y="268" class="body">Cached WAV playback</text><text x="1290" y="294" class="body">and camera heat map</text></g>
  <rect x="300" y="675" width="1000" height="48" rx="24" fill="#ffbd4a"/><text x="476" y="707" style="font:700 20px Arial;fill:#071d29">PRELOADED MODELS • EVENT-DRIVEN DELIVERY • CACHED AUDIO</text>
</svg>
