<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One vibration waveform expanded into a 60-position probability field</title>
  <desc id="desc">A physical strike creates a vibration waveform at one accelerometer. Temporal and FFT branches in a neural network decode the waveform into position probabilities, a heat map and coordinates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071d29"/><stop offset="1" stop-color="#183849"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#173b73"/><stop offset=".5" stop-color="#24a687"/><stop offset=".75" stop-color="#ffd64d"/><stop offset="1" stop-color="#f04b3e"/></linearGradient>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="20" refY="12" orient="auto"><path d="M0 0L24 12L0 24Z" fill="#ffbd4a"/></marker>
    <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
    <style>.h{font:700 41px Arial,sans-serif;fill:#fff}.sub{font:22px Arial,sans-serif;fill:#adcbd5}.label{font:700 26px Arial,sans-serif;fill:#fff}.body{font:19px Arial,sans-serif;fill:#d9edf2}.tiny{font:16px Arial,sans-serif;fill:#adcbd5}.arrow{fill:none;stroke:#ffbd4a;stroke-width:7;marker-end:url(#a)}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="75" y="76" class="h">AI EXPANDS ONE VIBRATION SIGNAL INTO COORDINATE SPACE</text>
  <text x="75" y="114" class="sub">The modal mixture carries spatial information even though the sensor never moves</text>

  <g filter="url(#s)"><rect x="70" y="210" width="300" height="470" rx="28" fill="#123241" stroke="#59d3df" stroke-width="3"/>
    <text x="105" y="258" class="label">1. STRIKE</text><rect x="105" y="300" width="230" height="170" rx="16" fill="#daf1f4"/>
    <g stroke="#5b95a0" stroke-width="2"><path d="M162 300v170M220 300v170M278 300v170M105 357h230M105 414h230"/></g>
    <path d="M218 325v55M190 352h56" stroke="#ff5d49" stroke-width="8" stroke-linecap="round"/><circle cx="220" cy="420" r="13" fill="#10a6ad"/>
    <text x="105" y="525" class="body">Many bending modes ring</text><text x="105" y="557" class="body">at different strengths,</text><text x="105" y="589" class="body">frequencies and decay.</text><text x="105" y="635" class="tiny">one KX134 sensing point</text>
  </g>

  <path d="M370 445H475" class="arrow"/>
  <g filter="url(#s)"><rect x="480" y="210" width="325" height="470" rx="28" fill="#123241" stroke="#59d3df" stroke-width="3"/>
    <text x="515" y="258" class="label">2. WAVEFORM</text><rect x="515" y="300" width="255" height="170" rx="14" fill="#081c28"/>
    <path d="M525 390 C540 390 545 388 552 390 C559 392 566 364 573 418 C580 452 587 320 594 365 C601 443 608 340 615 410 C622 438 629 353 636 389 C643 419 650 365 657 391 C664 408 671 374 678 390 C685 400 692 383 699 390 C706 395 713 386 720 390 C727 394 734 387 760 390" fill="none" stroke="#ffbd4a" stroke-width="4"/>
    <text x="515" y="520" class="body">25.6 kHz sampling</text><text x="515" y="552" class="body">512 samples / 20 ms</text><text x="515" y="584" class="body">64 pre-trigger samples</text><text x="515" y="630" class="tiny">raw Z-axis acceleration</text>
  </g>

  <path d="M805 445H900" class="arrow"/>
  <g filter="url(#s)"><rect x="905" y="170" width="315" height="550" rx="28" fill="#0c686e" stroke="#67e2d4" stroke-width="3"/>
    <text x="940" y="218" class="label">3. ON-DEVICE AI</text>
    <rect x="940" y="265" width="245" height="130" rx="18" fill="#0a2633"/><text x="970" y="310" class="label">TEMPORAL</text><text x="970" y="345" class="body">onset • ringing • decay</text>
    <rect x="940" y="420" width="245" height="130" rx="18" fill="#0a2633"/><text x="970" y="465" class="label">EMBEDDED FFT</text><text x="970" y="500" class="body">spectral modal mixture</text>
    <path d="M1062 395v25" stroke="#ffbd4a" stroke-width="6"/>
    <rect x="940" y="580" width="245" height="85" rx="18" fill="#ffbd4a"/><text x="1062" y="617" text-anchor="middle" style="font:700 22px Arial;fill:#071d29">FUSED NETWORK</text><text x="1062" y="646" text-anchor="middle" style="font:18px Arial;fill:#071d29">5.90 M parameters</text>
  </g>

  <path d="M1220 445H1300" class="arrow"/>
  <g filter="url(#s)"><rect x="1305" y="210" width="230" height="470" rx="28" fill="#123241" stroke="#59d3df" stroke-width="3"/>
    <text x="1335" y="258" class="label">4. 60 POINTS</text><rect x="1335" y="300" width="170" height="225" rx="14" fill="url(#hot)"/>
    <g stroke="#fff" stroke-opacity=".4"><path d="M1377 300v225M1420 300v225M1462 300v225M1335 375h170M1335 450h170"/></g>
    <circle cx="1458" cy="405" r="18" fill="none" stroke="#fff" stroke-width="5"/><circle cx="1458" cy="405" r="5" fill="#fff"/>
    <text x="1335" y="575" class="body">Probability heat map</text><text x="1335" y="607" class="body">12-area result</text><text x="1335" y="639" class="body">XY estimate</text>
  </g>

  <rect x="380" y="795" width="840" height="52" rx="26" fill="#ffbd4a"/><text x="495" y="829" style="font:700 21px Arial;fill:#071d29">97.05% POSITION • 99.44% AREA • 1.78 mm MAP ERROR</text>
</svg>
