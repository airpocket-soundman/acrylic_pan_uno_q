<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UNO Q USB Camera Test</title>
  <style>
    :root{font-family:"Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;color:#edf5fb;background:#081018}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;grid-template-rows:auto 1fr;background:#081018}
    header{display:flex;align-items:center;gap:16px;padding:12px 18px;background:#12212d;border-bottom:1px solid #294355}
    h1{margin:0;font-size:20px}p{margin:0;color:#a9bdcb}.state{margin-left:auto;padding:5px 10px;border-radius:999px;background:#263e4e}.state.online{background:#176b39}
    main{display:grid;place-items:center;min-height:0;padding:12px}iframe{width:100%;height:100%;min-height:calc(100vh - 78px);border:0;border-radius:10px;background:#000}
  </style>
</head>
<body>
  <header><div><h1>UNO Q USB Camera Test</h1><p>UNO Q上のカメラ配信のみを表示します（port 4912 /embed）</p></div><span id="state" class="state">接続中</span></header>
  <main><iframe id="camera" title="UNO Q USBカメラストリーム" allow="autoplay"></iframe></main>
  <script>
    const frame=document.getElementById('camera'),state=document.getElementById('state');
    const stream=`${location.protocol}//${location.hostname}:4912/embed`;
    frame.onload=()=>{state.textContent='映像配信中';state.classList.add('online');};
    frame.onerror=()=>{state.textContent='カメラ待機中';state.classList.remove('online');setTimeout(()=>{frame.src=stream+'?retry='+Date.now();},1500);};
    frame.src=stream;
  </script>
</body>
</html>
